#servoy
# Skilltest CI app-server config (SVY-21366).
#
# The install tarball ships an EMPTY servoy.properties (ServerManager.numberOfServers=0),
# so db:/example_data/customers could never resolve and every DB-bound baseline failed
# with "Table 'customers' not found in server 'example_data'".
#
# These are the 7 standard dev servers (bug_db, example_data, log_data, pdf_forms,
# repository_server, udm, user_data) BUT backed by in-memory HSQLDB instead of the
# dev Postgres on :5432 (which does not exist on the CI agent). In-mem HSQLDB keeps CI
# hermetic (no external DB), matching the cypress_test pattern used by developer.mcp.tests.
# Tables are created from the imported servoy_resources/.dbi schema at build time.
#
# Pointed at via -Dproperty-file in the surefire argLine (see pom.xml), the same
# mechanism developer.mcp.tests uses.
ApplicationServer.pingDelay=225
ServerManager.numberOfServers=7
SocketFactory.useSSL=true
SocketFactory.useTwoWaySocket=true
java.rmi.server.hostname=127.0.0.1
pdf_forms_plugin_servername=pdf_forms

server.0.URL=jdbc\:hsqldb\:mem\:bug_db
server.0.catalog=<none>
server.0.clientOnlyConnections=false
server.0.connectionValidationType=0
server.0.driver=org.hsqldb.jdbcDriver
server.0.enabled=true
server.0.maxConnectionsActive=5
server.0.maxConnectionsIdle=2
server.0.maxPreparedStatementsIdle=20
server.0.password=encrypted\:XAFg2JKIdj0\=
server.0.prefixTables=false
server.0.queryProcedures=false
server.0.schema=<none>
server.0.serverName=bug_db
server.0.skipSysTables=true
server.0.userName=sa

