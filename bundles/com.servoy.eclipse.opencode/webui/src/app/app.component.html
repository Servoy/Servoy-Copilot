<div class="app">
  <aside class="sidebar">
    <svy-session-list
      [tree]="store.sessionTree()"
      [activeSessionId]="store.activeSessionId()"
      (select)="onSelectSession($event)"
      (create)="onNewSession()"
      (rename)="onRenameSession($event)"
      (export)="onExportSession($event)"
      (archive)="onArchiveSession($event)"
      (remove)="onDeleteSession($event)"
    ></svy-session-list>
  </aside>

  <main class="chat">
    <header class="topbar">
      <svy-status-panel></svy-status-panel>
    </header>
    @if (store.error(); as error) {
      <div class="banner">{{ error }}</div>
    }
    <svy-message-list
      class="messages"
      [messages]="store.messages()"
      (openSession)="onSelectSession($event)"
    ></svy-message-list>
    @if (store.pendingForm(); as form) {
      <svy-form-card
        [form]="form"
        (submitForm)="onFormSubmit($event)"
        (cancelForm)="onFormCancel()"
      ></svy-form-card>
    }
    <svy-composer
      [streaming]="store.streaming()"
      [draft]="store.activeDraft()"
      [disabled]="store.activeIsSubagent() || !!store.pendingForm()"
      [disabledHint]="
        store.pendingForm()
          ? 'Answer the question above to continue.'
          : 'You\'re viewing a subagent session. Open its parent session to chat.'
      "
      (sendMessage)="onSend($event)"
      (stop)="onStop()"
      (draftChange)="onDraftChange($event)"
    ></svy-composer>
  </main>
  @if (debugEnabled) {
    <svy-debug-overlay></svy-debug-overlay>
  }
</div>
