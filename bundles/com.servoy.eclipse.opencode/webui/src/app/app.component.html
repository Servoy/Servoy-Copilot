<div class="app">
  <aside class="sidebar">
    <svy-session-list
      [tree]="store.sessionTree()"
      [activeSessionId]="store.activeSessionId()"
      (select)="onSelectSession($event)"
      (create)="onNewSession()"
      (rename)="onRenameSession($event)"
      (export)="onExportSession($event)"
      (archive)="onArchiveSession($event)"
      (remove)="onDeleteSession($event)"
    ></svy-session-list>
  </aside>

  <main class="chat">
    <header class="topbar">
      <svy-status-panel></svy-status-panel>
    </header>
    @if (store.error(); as error) {
      <div class="banner">{{ error }}</div>
    }
    <svy-message-list class="messages" [messages]="store.messages()"></svy-message-list>
    <svy-composer
      [streaming]="store.streaming()"
      [disabled]="store.activeIsSubagent()"
      (sendMessage)="onSend($event)"
      (stop)="onStop()"
    ></svy-composer>
  </main>
  @if (debugEnabled) {
    <svy-debug-overlay></svy-debug-overlay>
  }
</div>
