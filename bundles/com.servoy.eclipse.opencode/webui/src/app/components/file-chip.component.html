<button
  type="button"
  class="chip"
  [class.sm]="size() === 'sm'"
  [attr.title]="file().path"
  aria-haspopup="dialog"
  (click)="open($event)"
>
  <svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
    <path
      d="M4 1.5h5L12.5 5v9a.5.5 0 0 1-.5.5H4a.5.5 0 0 1-.5-.5V2a.5.5 0 0 1 .5-.5Z M9 1.5V5h3.5"
      fill="none"
      stroke="currentColor"
      stroke-width="1.2"
      stroke-linejoin="round"
    />
  </svg>
  <span class="caption">{{ file().caption }}</span>
  <span class="name">{{ file().name }}</span>
</button>
