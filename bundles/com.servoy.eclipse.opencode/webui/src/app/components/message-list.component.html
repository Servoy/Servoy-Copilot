<div class="scroll" #scroll (scroll)="onScroll()">
  <div class="messages">
    @for (message of messages(); track messageKey(message, $index)) {
      <svy-message-item
        [role]="message.info.role"
        [parts]="message.parts"
        [error]="message.info.error ?? null"
        [completed]="message.info.time?.completed ?? null"
        [childSignals]="childSignals()"
        [turnBusy]="turnBusy()"
        [latest]="$last"
        (openSession)="openSession.emit($event)"
      ></svy-message-item>
    } @empty {
      @if (showWelcome()) {
        <svy-welcome (pick)="starter.emit($event)"></svy-welcome>
      }
    }
  </div>
</div>
