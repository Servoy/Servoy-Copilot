<div
  class="composer"
  (drop)="onDrop($event)"
  (dragover)="onDragOver($event)"
  (dragenter)="onDragEnter($event)"
  (dragleave)="onDragLeave()"
>
  @if (dragging() && !disabled()) {
    <div class="drop-overlay" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
      <span>Drop images to attach</span>
    </div>
  }

  @if (disabled()) {
    <div class="disabled-hint">{{ disabledHint() }}</div>
  }

  @if (menuOpen()) {
    <svy-command-menu
      id="svy-cmd-menu"
      class="command-menu"
      [items]="items()"
      [activeIndex]="activeIndex()"
      (pick)="pickCommand($event)"
      (hover)="onHover($event)"
    ></svy-command-menu>
  }

  <svy-attachment-bar [attachments]="attachments()" (remove)="removeAttachment($event)"></svy-attachment-bar>

  <div class="input-row">
    <button
      type="button"
      class="attach-btn"
      (click)="openFilePicker()"
      title="Attach files"
      aria-label="Attach files"
      [disabled]="disabled()"
    >
      +
    </button>

    <textarea
      #textarea
      class="input"
      role="combobox"
      aria-autocomplete="list"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-controls]="menuOpen() ? 'svy-cmd-menu' : null"
      [attr.aria-activedescendant]="menuOpen() && items().length ? 'svy-cmd-' + activeIndex() : null"
      rows="1"
      [placeholder]="disabled() ? 'Chatting is disabled for subagent sessions' : 'Ask Servoy AI… Type &quot;/&quot; for commands'"
      [ngModel]="text()"
      [disabled]="disabled()"
      (input)="onInput($any($event.target).value)"
      (keydown)="onKeydown($event)"
      (paste)="onPaste($event)"
    ></textarea>

    @if (contextPercent() !== null) {
      <button
        type="button"
        class="ctx-ring"
        [class.high]="ringHigh()"
        [title]="ringTitle()"
        [attr.aria-label]="'Context ' + contextPercent() + '% used. Open status' + (ringHigh() ? ' - start a new session or compact' : '')"
        (click)="contextClick.emit()"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <circle class="track" cx="12" cy="12" r="9" pathLength="100" />
          <circle class="arc" cx="12" cy="12" r="9" pathLength="100" [attr.stroke-dasharray]="ringFill() + ' 100'" />
        </svg>
      </button>
    }

    @if (streaming()) {
      <button type="button" class="send-btn stop" (click)="onStop()" title="Stop" aria-label="Stop">■</button>
    } @else {
      <button
        type="button"
        class="send-btn"
        [class.active]="canSend() && !disabled()"
        (click)="submit()"
        title="Send"
        aria-label="Send"
        [disabled]="disabled() || !canSend()"
      >↑</button>
    }
  </div>

  <input #fileInput type="file" multiple hidden (change)="onFilesSelected($event)" />
</div>
