<div class="panel">
  <div class="summary">
    <span
      class="dot"
      [class.ok]="overall() === 'ok'"
      [class.warn]="overall() === 'warn'"
      [class.error]="overall() === 'error'"
      aria-hidden="true"
    ></span>
    <div class="summary-text" role="status">
      <span class="headline" [class.error-text]="overall() === 'error'">{{ summary().headline }}</span>
      @if (summary().detail) {
        <span class="sr-only"> - </span>
        <span class="detail">{{ summary().detail }}</span>
      }
    </div>
    <button
      type="button"
      class="refresh"
      [class.spinning]="loading()"
      [attr.aria-label]="loading() ? 'Refreshing…' : 'Refresh status'"
      [title]="loading() ? 'Refreshing…' : 'Refresh status'"
      [disabled]="loading()"
      (click)="refresh()"
    >
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.34-5.66" />
        <path d="M20 4v5h-5" />
      </svg>
    </button>
    <button
      type="button"
      class="close"
      aria-label="Close status"
      title="Close status"
      (click)="closed.emit()"
    >
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </div>

  <div class="facts">
    <div class="fact">
      <span class="dot" [class.ok]="!!solutionName()" aria-hidden="true"></span>
      <span class="fact-label">Solution</span>
      <span class="fact-value" [title]="solutionName() ?? '-'">{{ solutionName() ?? '-' }}</span>
    </div>
    <div class="fact">
      <span class="dot" [class.ok]="!!currentModel()" aria-hidden="true"></span>
      <span class="fact-label">Model</span>
      <span class="fact-value" [title]="currentModel() ?? '-'">{{ currentModel() ?? '-' }}</span>
    </div>
    <div class="fact">
      <span class="dot" [class.warn]="agentsWorking()" aria-hidden="true"></span>
      <span class="fact-label">Agents</span>
      <span class="fact-value">
        @if (agentsWorking()) {
          <span class="spinner" aria-hidden="true"></span>
          working
        } @else {
          idle
        }
      </span>
    </div>
  </div>

  <div class="mcp">
    <button
      type="button"
      class="mcp-toggle"
      [attr.aria-expanded]="mcpOpen()"
      aria-controls="status-mcp-list"
      (click)="toggleMcp()"
    >
      <svg class="caret" [class.open]="mcpOpen()" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 6l6 6-6 6" />
      </svg>
      <span class="mcp-title">MCP servers</span>
      <span class="mcp-count"> · {{ mcpOnline() }} of {{ mcpEnabled() }} online</span>
      @if (mcpOffline() > 0) {
        <span class="mcp-offline"> · {{ mcpOffline() }} offline</span>
      }
      @if (mcpDisabled() > 0) {
        <span class="mcp-disabled"> · {{ mcpDisabled() }} disabled</span>
      }
    </button>
    @if (mcpOpen()) {
      <div class="mcp-list" id="status-mcp-list">
        @for (row of mcpRows(); track row.name) {
          <div class="mcp-row">
            <span
              class="dot"
              [class.ok]="row.state === 'online'"
              [class.error]="row.state === 'offline'"
              aria-hidden="true"
            ></span>
            <span class="mcp-name">{{ row.name }}</span>
            <span class="mcp-state">{{ row.state }}</span>
          </div>
        }
      </div>
    }
  </div>
</div>
