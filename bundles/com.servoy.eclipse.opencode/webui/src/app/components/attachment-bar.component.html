@if (attachments().length > 0) {
  <div class="chips">
    @for (attachment of attachments(); track attachmentKey(attachment, $index)) {
      @if (isImage(attachment)) {
        <span class="thumb">
          <img [src]="attachment.url" [alt]="attachment.filename" [title]="attachment.filename" />
          <button
            type="button"
            class="thumb-remove"
            (click)="onRemove($index)"
            [attr.aria-label]="'Remove ' + attachment.filename"
          >&times;</button>
        </span>
      } @else {
      <span class="chip">
        <span class="chip-name" [title]="attachment.filename">{{ attachment.filename }}</span>
        <button type="button" class="chip-remove" (click)="onRemove($index)" aria-label="Remove attachment">×</button>
      </span>
      }
    }
  </div>
}
